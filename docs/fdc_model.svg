<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
 <title id="title">FDC probability-memory hydrologic model</title>
 <desc id="desc">Snow and soil accounting feed fast and slow routing stores. Hydrologic states determine an exceedance-probability state with wetting and drying memory. A basin-specific Kosugi flow-duration curve converts probability to discharge.</desc>
 <defs>
  <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#111"/></marker>
  <marker id="greenArrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#159447"/></marker>
  <style>
   .store{fill:#fff;stroke:#000;stroke-width:1.5}.operator{fill:#f7f7f7;stroke:#000;stroke-width:1.4}.flux{fill:none;stroke:#111;stroke-width:1.6;marker-end:url(#arrow)}.branch{fill:none;stroke:#111;stroke-width:1.6}.driver{fill:none;stroke:#555;stroke-width:1.25;stroke-dasharray:5 4;marker-end:url(#arrow)}.loss{fill:none;stroke:#159447;stroke-width:1.6;marker-end:url(#greenArrow)}.store-name{font-family:'Courier New',monospace;font-size:14px;font-weight:700}.math{font-family:'Cambria Math','Times New Roman',serif;font-size:17px;font-style:italic}.small{font-family:'Cambria Math','Times New Roman',serif;font-size:14px;font-style:italic}.note{font-family:'Cambria Math','Times New Roman',serif;font-size:12px;fill:#444}.number{fill:#c00000}.number-text{font-family:Arial,sans-serif;font-size:15px;fill:#fff;text-anchor:middle}.junction{fill:#111}.gate{fill:#fff;stroke:#000;stroke-width:1.2}
  </style>
 </defs>
 <rect width="720" height="760" fill="#f5f5f5"/>
 <text x="554" y="30" class="store-name" font-size="18">FDC MODEL</text>

 <!-- precipitation partition -->
 <text x="238" y="31" class="math">p<tspan baseline-shift="sub" font-size="12">t</tspan></text>
 <path d="M248 38V66" class="flux"/>
 <polygon points="248,67 274,93 248,119 222,93" class="gate"/>
 <text x="248" y="98" text-anchor="middle" class="small">f<tspan baseline-shift="sub" font-size="10" font-style="normal">snow</tspan></text>
 <text x="342" y="31" class="small">T<tspan baseline-shift="sub" font-size="10">t</tspan></text>
 <path d="M348 38V71H273" class="driver"/>
 <path d="M222 93H142V145" class="flux"/>
 <text x="150" y="84" class="small">p<tspan baseline-shift="sub" font-size="10" font-style="normal">snow</tspan></text>
 <path d="M274 93H349V274.5" class="flux"/>
 <text x="286" y="84" class="small">p<tspan baseline-shift="sub" font-size="10" font-style="normal">rain</tspan></text>

 <!-- Draw PET behind the snow store so the reservoir masks the driver. -->
 <path d="M103 38V277H153" class="driver"/>
 <text x="74" y="31" class="small">e<tspan baseline-shift="sub" font-size="10" font-style="normal">p</tspan></text>

 <!-- snow -->
 <rect x="58" y="145" width="190" height="78" class="store"/>
 <text x="229" y="163" text-anchor="end" class="store-name">SNOW</text>
 <text x="78" y="194" class="math">S<tspan baseline-shift="sub" font-size="12" font-style="normal">snow</tspan></text>
 <circle cx="248" cy="145" r="11" class="number"/><text x="248" y="150" class="number-text">1</text>
 <path d="M248 184H303" class="branch"/>
 <polygon points="323,164 343,184 323,204 303,184" class="gate"/>
 <text x="323" y="189" text-anchor="middle" class="small">f<tspan baseline-shift="sub" font-size="10" font-style="normal">dd</tspan></text>
 <path d="M343 184H380V279H353.5" class="flux"/>
 <text x="393" y="174" class="small">p<tspan baseline-shift="sub" font-size="10" font-style="normal">melt</tspan></text>
 <path d="M348 71H397V184H343" class="driver"/>
 <circle cx="349" cy="279" r="4.5" class="junction"/>
 <text x="382" y="268" class="small">p<tspan baseline-shift="sub" font-size="10" font-style="normal">liq</tspan></text>

 <!-- soil -->
 <rect x="214" y="314" width="270" height="76" class="store"/>
 <text x="466" y="333" text-anchor="end" class="store-name">SOIL</text>
 <text x="232" y="366" class="math">S<tspan baseline-shift="sub" font-size="12" font-style="normal">soil</tspan></text>
 <text x="289" y="366" class="note">capacity-limited root zone</text>
 <circle cx="484" cy="314" r="11" class="number"/><text x="484" y="319" class="number-text">2</text>
 <path d="M349 284V314" class="flux"/>
 <path d="M214 360H153V292" class="loss"/>
 <text x="85" y="286" class="small" fill="#159447">e<tspan baseline-shift="sub" font-size="10" font-style="normal">a</tspan></text>
 <text x="80" y="303" class="note" fill="#159447">actual ET</text>

 <!-- runoff partition -->
 <path d="M484 349H526" class="branch"/>
 <circle cx="526" cy="349" r="4.5" class="junction"/>
 <text x="497" y="339" class="small">q<tspan baseline-shift="sub" font-size="10" font-style="normal">quick</tspan></text>
 <path d="M349 390V438" class="branch"/>
 <polygon points="349,438 369,458 349,478 329,458" class="gate"/>
 <text x="349" y="463" text-anchor="middle" class="small">ω<tspan baseline-shift="sub" font-size="10" font-style="normal">f</tspan></text>
 <text x="359" y="428" class="small">q<tspan baseline-shift="sub" font-size="10" font-style="normal">perc</tspan></text>
 <path d="M369 458H526V411" class="flux"/>
 <path d="M329 458H194V508" class="flux"/>
 <path d="M526 349V411" class="flux"/>

 <!-- Draw the soil-wetness driver before the routing and probability
      stores so those reservoirs mask every crossing segment. -->
 <path d="M484 390H584V613H552" class="driver"/>
 <path d="M526 489V535H396" class="driver"/>
 <path d="M283 547H396" class="driver"/>
 <text x="562" y="397" class="note">soil wetness</text>

 <!-- fast and slow routing -->
 <rect x="437" y="411" width="178" height="78" class="store"/>
 <text x="597" y="430" text-anchor="end" class="store-name">FAST</text>
 <text x="457" y="463" class="math">S<tspan baseline-shift="sub" font-size="12" font-style="normal">fast</tspan></text>
 <circle cx="615" cy="411" r="11" class="number"/><text x="615" y="416" class="number-text">3</text>
 <rect x="105" y="508" width="178" height="78" class="store"/>
 <text x="265" y="527" text-anchor="end" class="store-name">SLOW</text>
 <text x="125" y="560" class="math">S<tspan baseline-shift="sub" font-size="12" font-style="normal">slow</tspan></text>
 <circle cx="283" cy="508" r="11" class="number"/><text x="283" y="513" class="number-text">4</text>
 <text x="470" y="526" class="small">q<tspan baseline-shift="sub" font-size="10" font-style="normal">fast</tspan></text>
 <text x="303" y="538" class="small">q<tspan baseline-shift="sub" font-size="10" font-style="normal">slow</tspan></text>

 <!-- probability memory -->
 <rect x="302" y="572" width="250" height="83" class="store"/>
 <text x="534" y="591" text-anchor="end" class="store-name">EXCEEDANCE PROBABILITY</text>
 <text x="322" y="626" class="math">p<tspan baseline-shift="sub" font-size="12">t</tspan></text>
 <text x="354" y="626" class="note">wetting/drying memory</text>
 <circle cx="552" cy="572" r="11" class="number"/><text x="552" y="577" class="number-text">5</text>
 <path d="M396 541V572" class="driver"/>

 <!-- Kosugi observation operator and discharge -->
 <path d="M427 655V679" class="flux"/>
 <rect x="302" y="679" width="250" height="48" rx="8" class="operator"/>
 <text x="427" y="699" text-anchor="middle" class="store-name">KOSUGI FDC</text>
 <text x="427" y="717" text-anchor="middle" class="small">a, b, c, p<tspan baseline-shift="sub" font-size="10">0</tspan><tspan font-style="normal"> fixed by basin</tspan></text>
 <path d="M552 703H657" class="flux"/>
 <text x="606" y="691" class="math">q<tspan baseline-shift="sub" font-size="12">t</tspan></text>
</svg>
